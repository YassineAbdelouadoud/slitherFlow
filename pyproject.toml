[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slitherflow"
version = "0.1.0"
description = "slitherFlow: draw Snakemake pipelines as nf-core-style subway (metro) maps"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pyyaml>=5"]

[project.scripts]
slitherflow = "slitherflow:main"

[tool.setuptools]
py-modules = ["slitherflow"]
