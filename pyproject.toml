[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slitherflow"
dynamic = ["version"]
description = "slitherFlow: subway maps for Snakemake pipelines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
dependencies = ["pyyaml>=5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
slitherflow = "slitherflow.cli:main"

[tool.setuptools]
packages = ["slitherflow"]

[tool.setuptools.dynamic]
version = {attr = "slitherflow.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
